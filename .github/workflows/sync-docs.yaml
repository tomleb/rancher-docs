name: Sync API documentation

on:
  workflow_dispatch:
    inputs:
      rancher_run_id:
        description: "Run id for rancher CI"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync documentation
    runs-on: ubuntu-latest
    steps:
      - name : Checkout rancher-docs repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ github.token }}
          # Allow making git push request later on
          persist-credentials: true

      - name: Configure the committer
        run: |
          git config --global user.name "test"
          git config --global user.email "test@test.com"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_USER: "${{ steps.app-token.outputs.app-slug }}[bot]"

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        id: download
        with:
          name: api-docs
          run-id: ${{ github.event.inputs.rancher_run_id }}
          github-token: ${{ github.token }}
          repository: rancher/rancher

      - name: Create PR
        run: |
          mv docs.json openapi/swagger-v2.10.json
          BRANCH="sync-docs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BRANCH=${BRANCH}" >> $GITHUB_ENV
          git checkout -b "$BRANCH"
          git add openapi
          git commit -m "Sync docs"
          git push origin "$BRANCH"
          gh pr create \
            --title "[$WEBHOOK_REF] Sync webhook dependencies" \
            --body "$body" \
            --reviewer "$GITHUB_TRIGGERING_ACTOR" \
            --repo "tomleb/rancher-docs" \
            --head "tomleb:$BRANCH" \
            --base "$WEBHOOK_REF"
        env:
          GH_TOKEN: ${{ github.token }}
